<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F4F0">
  <meta name="description" content="PlayStation 5 Slim Standard 1 TB — oferta no Mercado Livre por R$ 3.500,00.">
  <title>PlayStation 5 Slim Standard 1 TB — NEXO Achados</title>
  <style>
    :root { color-scheme: light; --ink: #171717; --paper: #F5F4F0; --white: #FFFFFF; --champagne: #B7A58A; --sage: #8C9690; --line: #E8E7E3; --muted: #73736E; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
    main { width: min(100%, 620px); padding: clamp(26px, 6vw, 48px); border: 1px solid var(--line); border-radius: 20px; background: var(--white); }
    a { color: inherit; }
    .brand { display: inline-flex; gap: 7px; color: var(--ink); font-size: 14px; font-weight: 750; letter-spacing: -.04em; text-decoration: none; }
    .brand span { color: var(--muted); font-weight: 450; }
    .category { margin: 38px 0 10px; color: #857966; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 13px; font-size: clamp(27px, 6vw, 38px); line-height: 1.12; letter-spacing: -.055em; }
    .details { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .marketplace { margin: 24px 0 0; color: #71695d; font-size: 12px; font-weight: 600; }
    .price { margin: 7px 0 25px; font-size: 32px; font-weight: 650; letter-spacing: -.05em; }
    .buy { display: inline-flex; justify-content: center; width: 100%; padding: 15px 20px; border-radius: 999px; background: var(--ink); color: var(--white); font-size: 13px; font-weight: 600; text-decoration: none; transition: background .2s ease, transform .2s ease; }
    .buy:hover { transform: translateY(-1px); background: #393833; }
    .note { margin: 16px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    a:focus-visible { outline: 2px solid var(--champagne); outline-offset: 4px; }
    @media (max-width: 480px) { body { padding: 16px; } main { border-radius: 16px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="./" aria-label="NEXO Achados — início">NEXO <span>Achados</span></a>
    <p class="category">Consoles</p>
    <h1>Console PlayStation 5 Sony Slim Standard 1 TB</h1>
    <p class="details">Produto novo · Versão Standard · Anúncio internacional no Mercado Livre.</p>
    <p class="marketplace">Oferta no Mercado Livre</p>
    <p class="price">R$ 3.500,00</p>
    <a class="buy" href="https://meli.la/2vc9uPn" target="_blank" rel="noopener noreferrer">Ver oferta no Mercado Livre</a>
    <p class="note">Preço e disponibilidade podem mudar. Confira as condições diretamente no anúncio.</p>
  </main>
</body>
</html>
